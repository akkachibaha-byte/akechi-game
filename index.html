<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>موقع العكاشي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #061b35, #050b18);
      color: white;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 35px 18px;
    }

    h1 {
      font-size: 42px;
      margin: 15px 0 10px;
      text-shadow: 0 0 15px #0087ff;
    }

    .subtitle {
      font-size: 22px;
      color: #19a7ff;
      margin-bottom: 30px;
    }

    .main-image {
      width: 100%;
      max-width: 850px;
      border-radius: 18px;
      display: block;
      margin: 0 auto 30px;
      box-shadow: 0 0 35px rgba(0, 119, 255, 0.45);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .button {
      display: inline-block;
      padding: 16px 30px;
      border-radius: 12px;
      background: linear-gradient(135deg, #087cff, #0055cc);
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 5px 20px rgba(0, 119, 255, 0.35);
      transition: 0.25s;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 119, 255, 0.6);
    }

    .button:active {
      transform: scale(0.96);
    }

    footer {
      margin-top: 45px;
      padding: 20px;
      color: #888;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 25px 12px;
      }

      h1 {
        font-size: 32px;
      }

      .subtitle {
        font-size: 18px;
      }

      .button {
        width: 90%;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎮 موقع العكاشي</h1>

    <div class="subtitle">
      مرحباً بيك في الموقع 😎
    </div>

    <!-- حط اسم الصورة متاعك هنا -->
    <img
      class="main-image"
      src="image.jpg"
      alt="العكاشي">

    <div class="buttons">

      <a class="button" href="#">
        🎮 PS4 13.52
      </a>

    </div>

    <footer>
      © 2026 العكاشي
    </footer>

  </div>

</body>
</html>
